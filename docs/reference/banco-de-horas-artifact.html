<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco de Horas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="app-style">
  :root{
    --paper:#EFF2ED; --paper-raised:#FFFFFF;
    --ink:#1E2A22; --ink-soft:#51604F; --ink-faint:#8B978A;
    --line:#D9DFD5;
    --accent:#B8792E; --accent-strong:#8A5A1E; --accent-soft:rgba(184,121,46,.14); --accent-ink:#FFFFFF;
    --good:#3E7C74; --good-soft:rgba(62,124,116,.13);
    --spent:#A24A36; --spent-soft:rgba(162,74,54,.13);
    --shadow:0 1px 2px rgba(30,42,34,.07), 0 6px 16px rgba(30,42,34,.06);
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#161B15; --paper-raised:#1F251D;
      --ink:#E7ECE2; --ink-soft:#ABB6A6; --ink-faint:#71806D;
      --line:#2C352A;
      --accent:#D89A50; --accent-strong:#F0C083; --accent-soft:rgba(216,154,80,.18); --accent-ink:#20180C;
      --good:#74B7AC; --good-soft:rgba(116,183,172,.16);
      --spent:#DB8168; --spent-soft:rgba(219,129,104,.16);
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 20px rgba(0,0,0,.32);
    }
  }
  :root[data-theme="dark"]{
    --paper:#161B15; --paper-raised:#1F251D;
    --ink:#E7ECE2; --ink-soft:#ABB6A6; --ink-faint:#71806D;
    --line:#2C352A;
    --accent:#D89A50; --accent-strong:#F0C083; --accent-soft:rgba(216,154,80,.18); --accent-ink:#20180C;
    --good:#74B7AC; --good-soft:rgba(116,183,172,.16);
    --spent:#DB8168; --spent-soft:rgba(219,129,104,.16);
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 20px rgba(0,0,0,.32);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, sans-serif;
    font-size:15px; line-height:1.5;
  }
  ::selection{ background:var(--accent-soft); }
  .num{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  .wrap{ max-width:960px; margin:0 auto; padding:36px 20px 64px; }
  a{ color:var(--accent); }

  header.top{ margin-bottom:28px; }
  header.top h1{
    font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:2rem;
    margin:0 0 4px; letter-spacing:-.01em; text-wrap:balance;
  }
  header.top p.sub{ margin:0; color:var(--ink-soft); font-size:.95rem; max-width:60ch; }

  nav.tabs{
    display:inline-flex; gap:2px; margin-top:20px; padding:3px;
    background:var(--paper-raised); border:1px solid var(--line); border-radius:999px;
  }
  nav.tabs button{
    border:none; background:transparent; padding:8px 18px; border-radius:999px;
    font:inherit; font-size:.86rem; font-weight:500; color:var(--ink-soft); cursor:pointer;
  }
  nav.tabs button.active{ background:var(--accent-soft); color:var(--accent-strong); }
  nav.tabs button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  h2.section-title{
    font-family:"Fraunces", Georgia, serif; font-weight:500; font-size:1.15rem;
    margin:0 0 12px; color:var(--ink);
  }
  section.block{ margin-top:34px; }
  p.hint{ color:var(--ink-faint); font-size:.82rem; margin:6px 0 0; }
  p.empty{ color:var(--ink-faint); font-size:.9rem; padding:18px 0; }

  input.filter{
    width:100%; max-width:320px; padding:9px 12px; margin-bottom:16px;
    border:1px solid var(--line); border-radius:8px; background:var(--paper-raised);
    color:var(--ink); font:inherit; font-size:.9rem;
  }

  .grid-cards{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;
  }
  .card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; text-align:left; cursor:pointer; font:inherit; color:inherit;
  }
  .card:hover{ border-color:var(--accent); }
  .card.selected{ border-color:var(--accent); box-shadow:var(--shadow); }
  .card .name{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.02rem; }
  .card .role{ color:var(--ink-soft); font-size:.78rem; margin-top:1px; }
  .card .stats{ margin-top:12px; padding-top:10px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:6px; }
  .stat-row{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .stat-row .label{ color:var(--ink-soft); font-size:.78rem; }
  .stat-row .value{ font-size:.92rem; font-weight:500; white-space:nowrap; }
  .value.good{ color:var(--good); } .value.spent{ color:var(--spent); } .value.pending{ color:var(--accent-strong); } .value.zero{ color:var(--ink-faint); }

  .detail-panel{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; margin-top:16px;
  }
  .detail-head{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .detail-head h3{ font-family:"Fraunces", Georgia, serif; font-size:1.1rem; margin:0; }
  .link-btn{ border:none; background:none; color:var(--ink-soft); font:inherit; font-size:.82rem; cursor:pointer; padding:0; }
  .link-btn:hover{ color:var(--ink); }

  .table-wrap{ overflow-x:auto; margin-top:12px; }
  table{ width:100%; border-collapse:collapse; font-size:.86rem; }
  th{ text-align:left; font-weight:500; color:var(--ink-soft); font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; padding:0 10px 8px 0; border-bottom:1px solid var(--line); white-space:nowrap; }
  td{ padding:9px 10px 9px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:last-child td{ border-bottom:none; }
  td.amount{ white-space:nowrap; font-weight:500; }
  .tag{ display:inline-block; padding:2px 8px; border-radius:999px; background:var(--paper); border:1px solid var(--line); font-size:.76rem; color:var(--ink-soft); white-space:nowrap; }

  .gate{ max-width:340px; margin:20px auto; text-align:center; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); padding:28px 24px; }
  .gate p{ margin:0 0 14px; color:var(--ink-soft); font-size:.88rem; }
  .gate input{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink); font:inherit; text-align:center; letter-spacing:.1em; }
  .gate .err{ color:var(--spent); font-size:.82rem; min-height:1.2em; margin-top:8px; }

  button.btn{
    border:none; border-radius:8px; padding:10px 16px; font:inherit; font-size:.88rem; font-weight:500;
    cursor:pointer; background:var(--accent); color:var(--accent-ink);
  }
  button.btn:hover{ background:var(--accent-strong); }
  button.btn.ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  button.btn.ghost:hover{ color:var(--ink); border-color:var(--ink-soft); }
  button.btn.danger{ background:transparent; color:var(--spent); border:1px solid var(--spent-soft); padding:5px 10px; font-size:.78rem; }
  button.btn.danger:hover{ background:var(--spent-soft); }
  button.btn:disabled{ opacity:.5; cursor:default; }
  button.btn.small{ padding:6px 12px; font-size:.8rem; }

  form.stack{ display:flex; flex-direction:column; gap:4px; }
  .field-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }
  label.field{ display:flex; flex-direction:column; gap:5px; font-size:.8rem; color:var(--ink-soft); }
  label.field input, label.field select{
    padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--paper);
    color:var(--ink); font:inherit; font-size:.9rem;
  }
  label.field.wide{ grid-column:1/-1; }
  form.stack > .actions{ margin-top:6px; display:flex; align-items:center; gap:12px; }
  .status{ font-size:.82rem; color:var(--ink-faint); }
  .status.ok{ color:var(--good); } .status.error{ color:var(--spent); }

  .summary-table td, .summary-table th{ padding:8px 14px 8px 0; }
  .row-actions{ display:flex; gap:8px; align-items:center; }

  .emp-manage-row{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .emp-manage-row:last-child{ border-bottom:none; }
  .emp-manage-row .who{ display:flex; flex-direction:column; }
  .emp-manage-row .who .role{ color:var(--ink-soft); font-size:.78rem; }
  .toggle-chip{ font-size:.76rem; padding:3px 10px; border-radius:999px; border:1px solid var(--line); background:none; color:var(--ink-soft); cursor:pointer; }
  .toggle-chip.active{ border-color:var(--good); color:var(--good); background:var(--good-soft); }

  .banner{ background:var(--accent-soft); color:var(--accent-strong); border-radius:8px; padding:10px 14px; font-size:.84rem; margin-bottom:20px; }
  footer.foot{ margin-top:48px; color:var(--ink-faint); font-size:.78rem; }
</style>
</head>
<body>
<div id="app">Cargando…</div>
<script id="state-data" type="application/json">{"employees":[{"id":"e1","name":"Ana Salas (ejemplo)","role":"Diseñadora","active":true},{"id":"e2","name":"Luis Gómez (ejemplo)","role":"Desarrollador","active":true},{"id":"e3","name":"Carla Vindas (ejemplo)","role":"Community Manager","active":true}],"movements":[{"id":"m1","employeeId":"e1","type":"overtime","amount":6,"date":"2026-08-10","note":"Cierre de campaña GIZ: se quedó hasta las 7pm"},{"id":"m2","employeeId":"e1","type":"overtime","amount":-2,"date":"2026-08-22","note":"Salió 2 horas antes el viernes (cambio por horas acumuladas)"},{"id":"m3","employeeId":"e1","type":"vacation","amount":1.25,"date":"2026-08-31","note":"Acumulación mensual de agosto"},{"id":"m4","employeeId":"e1","type":"vacation","amount":-1,"date":"2026-08-14","note":"Tomó el viernes libre"},{"id":"m5","employeeId":"e1","type":"holiday","amount":1,"date":"2026-08-15","note":"Trabajó el feriado del 15 de agosto (Día de la Madre); queda pendiente de canjear"},{"id":"m6","employeeId":"e2","type":"overtime","amount":10,"date":"2026-08-05","note":"Soporte de fin de semana por el lanzamiento de la web"},{"id":"m7","employeeId":"e2","type":"vacation","amount":1.25,"date":"2026-08-31","note":"Acumulación mensual de agosto"},{"id":"m8","employeeId":"e2","type":"holiday","amount":1,"date":"2026-01-01","note":"Trabajó el 1 de enero; feriado pendiente de canjear"},{"id":"m9","employeeId":"e2","type":"holiday","amount":-1,"date":"2026-08-20","note":"Canjeó el feriado pendiente; tomó el día libre"},{"id":"m10","employeeId":"e3","type":"overtime","amount":3,"date":"2026-08-18","note":"Cobertura de evento el sábado"},{"id":"m11","employeeId":"e3","type":"vacation","amount":1.25,"date":"2026-07-31","note":"Acumulación mensual de julio"},{"id":"m12","employeeId":"e3","type":"vacation","amount":1.25,"date":"2026-08-31","note":"Acumulación mensual de agosto"},{"id":"m13","employeeId":"e3","type":"vacation","amount":-2,"date":"2026-08-05","note":"Tomó dos días de vacaciones"},{"id":"m14","employeeId":"e3","type":"holiday","amount":1,"date":"2026-07-25","note":"Trabajó el feriado del 25 de julio (Anexión de Guanacaste); queda pendiente de canjear"},{"id":"m_mtm65c3oxaa1p","employeeId":"e2","type":"overtime","amount":0.5,"date":"2026-09-03","note":""}]}</script>
<script id="logic">
(function(){
  "use strict";

  var STYLE_TEXT = document.getElementById("app-style").textContent;
  var LOGIC_TEXT = document.getElementById("logic").textContent;
  var STATE = JSON.parse(document.getElementById("state-data").textContent);

  var ADMIN_PIN = "2026";
  var TYPE_LABEL = { overtime: "Horas extra", vacation: "Vacaciones", holiday: "Feriados" };
  var TYPE_UNIT = { overtime: "h", vacation: "d", holiday: "d" };

  var ui = {
    tab: "consulta",
    query: "",
    selectedId: STATE.employees[0] ? STATE.employees[0].id : null,
    adminUnlocked: false,
    gateError: "",
    saveStatus: "",
    saveStatusKind: "",
    newEmpName: "",
    newEmpRole: ""
  };

  var artifactApi = null;
  var artifactAvailable = null; // null = unknown yet, true/false once resolved
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (a) {
      artifactApi = a;
      artifactAvailable = !!a;
      render();
    });
  } else {
    artifactAvailable = false;
  }

  function uid(prefix) {
    return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function empById(id) {
    for (var i = 0; i < STATE.employees.length; i++) if (STATE.employees[i].id === id) return STATE.employees[i];
    return null;
  }

  function balances(employeeId) {
    var out = { overtime: 0, vacation: 0, holiday: 0 };
    STATE.movements.forEach(function (m) {
      if (m.employeeId === employeeId) out[m.type] += m.amount;
    });
    return out;
  }

  function fmtAmount(n, unit) {
    var rounded = Math.round(n * 100) / 100;
    var s = (rounded % 1 === 0) ? rounded.toFixed(0) : rounded.toFixed(2).replace(/0$/, "");
    return (rounded > 0 ? "+" : "") + s + " " + unit;
  }

  function fmtSigned(n, unit) {
    var rounded = Math.round(n * 100) / 100;
    var s = (rounded % 1 === 0) ? Math.abs(rounded).toFixed(0) : Math.abs(rounded).toFixed(2).replace(/0$/, "");
    return (rounded < 0 ? "−" : "+") + s + " " + unit;
  }

  function fmtDate(iso) {
    var d = new Date(iso + "T12:00:00");
    return d.toLocaleDateString("es-CR", { day: "2-digit", month: "short", year: "numeric" });
  }

  function toneClass(kind, value) {
    if (kind === "holiday") return value > 0 ? "pending" : "zero";
    return value > 0 ? "good" : (value < 0 ? "spent" : "zero");
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------- rendering ----------

  function render() {
    document.getElementById("app").innerHTML = renderApp();
    attachHandlers();
  }

  function renderApp() {
    var html = "";
    html += '<div class="wrap">';
    html += '<header class="top">';
    html += "<h1>Banco de Horas</h1>";
    html += '<p class="sub">Horas extra, vacaciones y feriados por canjear del equipo — effekktive.</p>';
    html += '<nav class="tabs">';
    html += '<button data-tab="consulta" class="' + (ui.tab === "consulta" ? "active" : "") + '">Consultar saldo</button>';
    html += '<button data-tab="admin" class="' + (ui.tab === "admin" ? "active" : "") + '">Panel administrador</button>';
    html += "</nav>";
    html += "</header>";

    if (artifactAvailable === false) {
      html += '<div class="banner">Los cambios que hagas en esta vista no se van a guardar de forma permanente en este entorno.</div>';
    }

    html += ui.tab === "consulta" ? renderConsulta() : renderAdmin();
    html += '<footer class="foot">Los movimientos con signo positivo suman al saldo; con signo negativo, restan. El saldo de cada persona es siempre la suma de su historial.</footer>';
    html += "</div>";
    return html;
  }

  function renderConsulta() {
    var q = ui.query.trim().toLowerCase();
    var list = STATE.employees.filter(function (e) {
      return e.active !== false && (!q || e.name.toLowerCase().indexOf(q) !== -1);
    });

    var html = "";
    html += '<input class="filter" id="filter-input" type="text" placeholder="Buscar por nombre…" value="' + esc(ui.query) + '">';

    if (list.length === 0) {
      html += '<p class="empty">No hay colaboradores que coincidan con la búsqueda.</p>';
    } else {
      html += '<div class="grid-cards">';
      list.forEach(function (e) {
        var b = balances(e.id);
        var sel = e.id === ui.selectedId ? " selected" : "";
        html += '<button class="card' + sel + '" data-select="' + e.id + '">';
        html += '<div class="name">' + esc(e.name) + "</div>";
        html += '<div class="role">' + esc(e.role || "") + "</div>";
        html += '<div class="stats">';
        html += statRow("Horas extra", fmtAmount(b.overtime, "h"), toneClass("overtime", b.overtime));
        html += statRow("Vacaciones", fmtAmount(b.vacation, "d"), toneClass("vacation", b.vacation));
        html += statRow("Feriados por canjear", fmtAmount(b.holiday, "d"), toneClass("holiday", b.holiday));
        html += "</div></button>";
      });
      html += "</div>";
    }

    var sel = empById(ui.selectedId);
    if (sel && list.some(function (e) { return e.id === sel.id; })) {
      html += renderHistory(sel, false);
    }

    return html;
  }

  function statRow(label, value, tone) {
    return '<div class="stat-row"><span class="label">' + label + '</span><span class="value ' + tone + ' num">' + value + "</span></div>";
  }

  function renderHistory(emp, adminMode) {
    var rows = STATE.movements.filter(function (m) { return m.employeeId === emp.id; })
      .sort(function (a, b) { return b.date < a.date ? -1 : 1; });

    var html = '<div class="detail-panel">';
    html += '<div class="detail-head"><h3>Historial — ' + esc(emp.name) + "</h3>";
    if (!adminMode) html += '<button class="link-btn" data-deselect="1">Cerrar</button>';
    html += "</div>";

    if (rows.length === 0) {
      html += '<p class="empty">Todavía no hay movimientos registrados.</p>';
    } else {
      html += '<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Cantidad</th><th>Nota</th>' + (adminMode ? "<th></th>" : "") + "</tr></thead><tbody>";
      rows.forEach(function (m) {
        html += "<tr>";
        html += "<td>" + fmtDate(m.date) + "</td>";
        html += '<td><span class="tag">' + TYPE_LABEL[m.type] + "</span></td>";
        html += '<td class="amount ' + toneClass(m.type, m.amount) + ' num">' + fmtSigned(m.amount, TYPE_UNIT[m.type]) + "</td>";
        html += "<td>" + esc(m.note || "") + "</td>";
        if (adminMode) html += '<td><button class="btn danger" data-delete-move="' + m.id + '">Eliminar</button></td>';
        html += "</tr>";
      });
      html += "</tbody></table></div>";
    }
    html += "</div>";
    return html;
  }

  function renderAdmin() {
    if (!ui.adminUnlocked) {
      return '<div class="gate">' +
        "<p>Este panel es solo para quien registra los movimientos. No es un candado real — cualquiera con el enlace de edición podría entrar viendo el código de la página. La protección real está en compartir el enlace de solo consulta con el equipo.</p>" +
        '<input id="pin-input" type="password" inputmode="numeric" placeholder="PIN">' +
        '<div class="err">' + esc(ui.gateError) + "</div>" +
        '<button class="btn" id="pin-submit" style="margin-top:12px;width:100%;">Entrar</button>' +
        "</div>";
    }

    var html = "";

    html += '<section class="block">';
    html += '<h2 class="section-title">Resumen general</h2>';
    html += '<div class="table-wrap"><table class="summary-table"><thead><tr><th>Colaborador</th><th>Horas extra</th><th>Vacaciones</th><th>Feriados por canjear</th></tr></thead><tbody>';
    STATE.employees.forEach(function (e) {
      var b = balances(e.id);
      html += "<tr" + (e.active === false ? ' style="opacity:.5"' : "") + ">";
      html += "<td>" + esc(e.name) + (e.active === false ? " (inactivo)" : "") + "</td>";
      html += '<td class="amount ' + toneClass("overtime", b.overtime) + ' num">' + fmtAmount(b.overtime, "h") + "</td>";
      html += '<td class="amount ' + toneClass("vacation", b.vacation) + ' num">' + fmtAmount(b.vacation, "d") + "</td>";
      html += '<td class="amount ' + toneClass("holiday", b.holiday) + ' num">' + fmtAmount(b.holiday, "d") + "</td>";
      html += "</tr>";
    });
    html += "</tbody></table></div>";
    html += "</section>";

    html += '<section class="block">';
    html += '<h2 class="section-title">Registrar movimiento</h2>';
    html += '<form class="stack" id="move-form">';
    html += '<div class="field-grid">';
    html += '<label class="field">Colaborador<select name="employeeId">' + STATE.employees.filter(function(e){return e.active!==false;}).map(function (e) {
      return '<option value="' + e.id + '">' + esc(e.name) + "</option>";
    }).join("") + "</select></label>";
    html += '<label class="field">Tipo<select name="type">' +
      '<option value="overtime">Horas extra</option>' +
      '<option value="vacation">Vacaciones</option>' +
      '<option value="holiday">Feriados por canjear</option>' +
      "</select></label>";
    html += '<label class="field">Cantidad<input name="amount" type="number" step="0.25" placeholder="ej. 3 o -1" required></label>';
    html += '<label class="field">Fecha<input name="date" type="date" value="' + todayISO() + '" required></label>';
    html += '<label class="field wide">Nota<input name="note" type="text" placeholder="ej. Se quedó hasta las 7pm por el cierre de campaña"></label>';
    html += "</div>";
    html += '<p class="hint">Cantidad positiva suma al saldo (horas trabajadas de más, día no tomado); negativa resta (horas u días ya usados).</p>';
    html += '<div class="actions"><button class="btn" type="submit">Guardar movimiento</button><span class="status ' + ui.saveStatusKind + '">' + esc(ui.saveStatus) + "</span></div>";
    html += "</form>";
    html += "</section>";

    var recent = STATE.movements.slice().sort(function (a, b) { return b.date < a.date ? -1 : 1; }).slice(0, 15);
    html += '<section class="block">';
    html += '<h2 class="section-title">Movimientos recientes</h2>';
    if (recent.length === 0) {
      html += '<p class="empty">Todavía no hay movimientos.</p>';
    } else {
      html += '<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Colaborador</th><th>Tipo</th><th>Cantidad</th><th>Nota</th><th></th></tr></thead><tbody>';
      recent.forEach(function (m) {
        var e = empById(m.employeeId);
        html += "<tr><td>" + fmtDate(m.date) + "</td><td>" + esc(e ? e.name : "?") + '</td><td><span class="tag">' + TYPE_LABEL[m.type] + "</span></td>";
        html += '<td class="amount ' + toneClass(m.type, m.amount) + ' num">' + fmtSigned(m.amount, TYPE_UNIT[m.type]) + "</td><td>" + esc(m.note || "") + "</td>";
        html += '<td><button class="btn danger" data-delete-move="' + m.id + '">Eliminar</button></td></tr>';
      });
      html += "</tbody></table></div>";
      html += '<p class="hint">Mostrando los últimos 15 de ' + STATE.movements.length + " movimientos en total.</p>";
    }
    html += "</section>";

    html += '<section class="block">';
    html += '<h2 class="section-title">Colaboradores</h2>';
    STATE.employees.forEach(function (e) {
      html += '<div class="emp-manage-row"><div class="who"><span>' + esc(e.name) + '</span><span class="role">' + esc(e.role || "") + "</span></div>";
      html += '<button class="toggle-chip ' + (e.active !== false ? "active" : "") + '" data-toggle-active="' + e.id + '">' + (e.active !== false ? "Activo" : "Inactivo") + "</button></div>";
    });
    html += '<form class="stack" id="emp-form" style="margin-top:16px;">';
    html += '<div class="field-grid">';
    html += '<label class="field">Nombre<input name="name" type="text" required placeholder="Nombre completo"></label>';
    html += '<label class="field">Puesto<input name="role" type="text" placeholder="ej. Diseñador"></label>';
    html += "</div>";
    html += '<div class="actions"><button class="btn ghost" type="submit">Agregar colaborador</button></div>';
    html += "</form>";
    html += "</section>";

    return html;
  }

  function todayISO() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  // ---------- persistence ----------

  function buildDocument(state) {
    return "<!doctype html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Banco de Horas</title>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n<style id=\"app-style\">" + STYLE_TEXT + "</style>\n</head>\n<body>\n<div id=\"app\">Cargando…</div>\n<script id=\"state-data\" type=\"application/json\">" + JSON.stringify(state) + "<" + "/script" + ">\n<script id=\"logic\">" + LOGIC_TEXT + "<" + "/script" + ">\n</body>\n</html>";
  }

  function persist() {
    render();
    if (!artifactApi) return;
    ui.saveStatus = "Guardando…"; ui.saveStatusKind = "";
    artifactApi.publish(buildDocument(STATE)).then(function () {
      ui.saveStatus = "Guardado"; ui.saveStatusKind = "ok"; render();
    }).catch(function (e) {
      ui.saveStatus = e && e.code === "conflict"
        ? "Alguien más guardó un cambio al mismo tiempo; esta acción no se aplicó. Volvé a intentarlo."
        : "No se pudo guardar (" + (e && e.code ? e.code : "error") + ").";
      ui.saveStatusKind = "error"; render();
    });
  }

  // ---------- events ----------

  function attachHandlers() {
    var app = document.getElementById("app");

    app.querySelectorAll("[data-tab]").forEach(function (b) {
      b.addEventListener("click", function () { ui.tab = b.getAttribute("data-tab"); ui.saveStatus = ""; render(); });
    });

    var filterInput = document.getElementById("filter-input");
    if (filterInput) {
      filterInput.addEventListener("input", function () { ui.query = filterInput.value; render(); filterInput.focus(); filterInput.setSelectionRange(filterInput.value.length, filterInput.value.length); });
    }

    app.querySelectorAll("[data-select]").forEach(function (b) {
      b.addEventListener("click", function () { ui.selectedId = b.getAttribute("data-select"); render(); });
    });
    var deselect = app.querySelector("[data-deselect]");
    if (deselect) deselect.addEventListener("click", function () { ui.selectedId = null; render(); });

    var pinInput = document.getElementById("pin-input");
    var pinSubmit = document.getElementById("pin-submit");
    if (pinSubmit) {
      var tryPin = function () {
        if (pinInput.value === ADMIN_PIN) { ui.adminUnlocked = true; ui.gateError = ""; render(); }
        else { ui.gateError = "PIN incorrecto."; render(); }
      };
      pinSubmit.addEventListener("click", tryPin);
      pinInput.addEventListener("keydown", function (ev) { if (ev.key === "Enter") tryPin(); });
    }

    var moveForm = document.getElementById("move-form");
    if (moveForm) {
      moveForm.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var fd = new FormData(moveForm);
        var amount = parseFloat(fd.get("amount"));
        if (!isFinite(amount) || amount === 0) { ui.saveStatus = "Ingresá una cantidad distinta de cero."; ui.saveStatusKind = "error"; render(); return; }
        STATE.movements.push({
          id: uid("m"),
          employeeId: fd.get("employeeId"),
          type: fd.get("type"),
          amount: amount,
          date: fd.get("date"),
          note: fd.get("note") || ""
        });
        persist();
      });
    }

    app.querySelectorAll("[data-delete-move]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-delete-move");
        STATE.movements = STATE.movements.filter(function (m) { return m.id !== id; });
        persist();
      });
    });

    app.querySelectorAll("[data-toggle-active]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-toggle-active");
        var e = empById(id);
        if (e) e.active = e.active === false ? true : false;
        persist();
      });
    });

    var empForm = document.getElementById("emp-form");
    if (empForm) {
      empForm.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var fd = new FormData(empForm);
        var name = (fd.get("name") || "").trim();
        if (!name) return;
        STATE.employees.push({ id: uid("e"), name: name, role: (fd.get("role") || "").trim(), active: true });
        persist();
      });
    }
  }

  render();
})();
</script>
</body>
</html>
